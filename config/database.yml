# SQLite version 3.x
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
#
default: &default
  adapter: postgresql
  pool: 100
  timeout: 50000
  host: <%= ENV['PGHOST'] %>
  port: <%= ENV['PGPORT'] %>
  username: <%= ENV['PGUSER'] %>
  password: <%= ENV['PGPASSWORD'] %>

development:
  <<: *default
  database: <%= ENV['PG_DB_DEV'] %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV['PG_DB_TEST'] %>

production:
  # Use POSTGRES_URL for Railway deployment
  url: <%= ENV['POSTGRES_URL'] || ENV['DATABASE_URL'] %>
  adapter: postgresql
  pool: 100
  timeout: 50000
